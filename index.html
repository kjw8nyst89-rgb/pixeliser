<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Pixeliser</title>

    <link
        rel="stylesheet"
        href="pixeliser.css"
    >

</head>


<body>

<div id="app">

    <div id="toolbar">

        

        <button id="openGrilleButton">
            Ouvrir une grille
        </button>

        <input
            id="grilleInput"
            type="file"
            accept=".grille,application/octet-stream"
            hidden
        >

        <button id="clearButton">
            Effacer
        </button>

        <button id="saveGrilleButton">Enregistrer la grille</button>

        <span id="info">
            Aucune image
        </span>

    </div>


    <div id="workspace">

        <canvas
            id="canvas"
            width="1"
            height="1">
        </canvas>

    </div>

</div>


<script
    type="module"
    src="./pixeliser.js">
</script>

</body>

</html>
<script>
if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
        navigator.serviceWorker.register("./service-worker.js")
            .then(function(registration){
                console.log("Service Worker enregistré :",registration.scope);
            })
            .catch(function(error){
                console.error("Échec enregistrement Service Worker :",error);
            });
    });
}
</script>
