<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Pixeliser</title>

    <link
        rel="stylesheet"
        href="pixeliser.css"
    >

</head>


<body>

<div id="app">

    <div id="toolbar">

        <button id="openButton">
            Ouvrir une image
        </button>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
            hidden
        >

        <button id="openGrilleButton">
            Ouvrir une grille
        </button>

        <input
            id="grilleInput"
            type="file"
            accept=".grille,application/octet-stream"
            hidden
        >

        <button id="clearButton">
            Effacer
        </button>

        <label for="tileSize">
            Taille :
        </label>

        <input
            id="tileSize"
            type="number"
            min="2"
            max="100"
            value="20"
            inputmode="numeric"
        >

        <span id="info">
            Aucune image
        </span>

    </div>


    <div id="workspace">

        <canvas
            id="canvas"
            width="1"
            height="1">
        </canvas>

    </div>

</div>


<script
    type="module"
    src="./pixeliser.js">
</script>

</body>

</html>
