<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Pixeliser</title>

    <link
        rel="stylesheet"
        href="pixeliser.css"
    >

</head>


<body>

    <!-- ==================================================
         BARRE D'OUTILS
         ================================================== -->

    <div id="toolbar">

        <!-- Ouvrir une image -->

        <button id="openButton">
            Ouvrir une image
        </button>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
            hidden
        >


        <!-- Ouvrir une grille -->

        <button id="openGrilleButton">
            Ouvrir une grille
        </button>

        <input
            id="grilleInput"
            type="file"
            accept=".grille,application/octet-stream"
            hidden
        >


        <!-- Effacer -->

        <button id="clearButton">
            Effacer
        </button>


        <!-- Taille des cases -->

        <label for="tileSize">
            Taille :
        </label>

        <input
            id="tileSize"
            type="number"
            min="2"
            max="100"
            value="20"
            inputmode="numeric"
        >


        <!-- Informations -->

        <span id="info">
            Aucune image
        </span>

    </div>


    <!-- ==================================================
         ZONE DE TRAVAIL
         ================================================== -->

    <div id="workspace">

        <canvas id="canvas"></canvas>

    </div>


    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script
        src="pixeliser.js"
    ></script>

</body>

</html>
