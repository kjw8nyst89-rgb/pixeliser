<!-- ===== PWA / installation écran d'accueil iPad ===== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1c1c1e">

<!-- Spécifique iOS/iPadOS (Safari ne lit pas toujours le manifest.json) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixeliser">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<!-- Empêche le zoom pincé sur l'UI (le zoom de la grille reste géré par ton code) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Pixeliser</title>

    <link
        rel="stylesheet"
        href="pixeliser.css"
    >

</head>


<body>

<div id="app">

    <div id="toolbar">

        

        <button id="openGrilleButton">
            Ouvrir une grille
        </button>

        <input
            id="grilleInput"
            type="file"
            accept=".grille,application/octet-stream"
            hidden
        >

        <button id="clearButton">
            Effacer
        </button>

        <button id="saveGrilleButton">Enregistrer la grille</button>

        <span id="info">
            Aucune image
        </span>

    </div>


    <div id="workspace">

        <canvas
            id="canvas"
            width="1"
            height="1">
        </canvas>

    </div>

</div>


<script
    type="module"
    src="./pixeliser.js">
</script>

</body>

</html>
<script>
if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
        navigator.serviceWorker.register("./service-worker.js")
            .then(function(registration){
                console.log("Service Worker enregistré :",registration.scope);
            })
            .catch(function(error){
                console.error("Échec enregistrement Service Worker :",error);
            });
    });
}
</script>
