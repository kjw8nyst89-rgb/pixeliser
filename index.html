<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no">

    <meta name="theme-color" content="#ffffff">

    <title>Pixeliser</title>

    <link rel="stylesheet" href="pixeliser.css">

</head>

<body>

<div id="app">

    <!-- Barre d'outils -->

    <div id="toolbar">

        <button id="openButton">
            Ouvrir une image
        </button>

        <button id="clearButton">
            Effacer
        </button>

        <label class="tileControl">
            Taille :
            <input id="tileSize"
                   type="number"
                   min="2"
                   max="100"
                   value="20">
        </label>

        <span id="info">
            Aucune image
        </span>

    </div>


    <!-- Input fichier invisible -->

    <input id="imageInput"
           type="file"
           accept="image/*"
           hidden>


    <!-- Zone de travail -->

    <div id="workspace">

        <canvas id="canvas"></canvas>

    </div>

</div>


<script src="pixeliser.js"></script>

</body>
</html>
